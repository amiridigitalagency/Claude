const canvas = document.getElementById('gl');

/* ================= MAIN PARTICLE SYSTEM (morphing formations) ================= */

forms.ring = mk();

/* ================= BLOB (definition scene) ================= */
const blobGeo = new THREE.SphereGeometry(1, 180, 130);
